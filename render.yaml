services:
  - type: web
    name: swarna-weda-madura-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: FRONTEND_URL
        value: https://swarna-weda-madura-ayu.web.app
